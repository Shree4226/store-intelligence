services:
  api:
    build: .
    ports:
      - "8000:8000"

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000/stores/STORE_BLR_002/metrics
    ports:
      - "8501:8501"
    depends_on:
      - api